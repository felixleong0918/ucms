<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="UCMS 大學社團整合管理平台：行政協作、活動與資源管理。" />
    <title>UCMS · 大學社團整合管理平台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%231d1d1f'/%3E%3Ctext x='20' y='29' text-anchor='middle' fill='white' font-family='Georgia,serif' font-weight='700' font-size='26'%3Eu%3C/text%3E%3C/svg%3E"
    />
    <!-- 襯線標題字體；無法連線時會退回系統宋體。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&display=swap"
    />
    <script>
      // 在樣式載入前套用已儲存的深淺色，避免閃爍。
      try {
        var t = localStorage.getItem('ucms-theme');
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="./config.js"></script>
    <script src="./app.js" defer></script>
  </body>
</html>
